name: Git Hub Action Test Project
on: workflow_dispatch
jobs:
    first-job:
        runs-on: ubuntu-latest
        steps:
            - name: Print Greeting
              run: echo "Hello, World!"
            - name: Print Current Date
              run: date
            - name: Print Current Directory
              run: pwd
            - name: Print GoodBye
              run: echo "Goodbye, World!"