name: Git Hub Action Test Project
on: [push, workflow_dispatch]
jobs:
    tests:
      runs-on: ubuntu-latest
      steps:
        - name: Checkout Repository
          uses: actions/checkout@v3
        - name: Install NodeJS
          uses: actions/setup-node@v3
          with:
            node-version: 18
        - name: Install Dependencies
          run: npm ci
        - name: Run tests
          run: npm test
    deploy:
      runs-on: ubuntu-latest
      steps:
        - name: checkout Repository
          uses: actions/checkout@v3
        - name: Install NodeJS
          uses: actions/setup-node@v3
          with:
            node-version: 18
        - name: Install Dependencies
          run: npm ci
        - name: Deploy
          run: echo "Deploying...."
