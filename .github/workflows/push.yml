name: onpush_workflow
on: push
jobs:
    on_push_job:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Repository
              uses: actions/checkout@v3
            - name: install NodeJS
              uses: actions/setup-node@v3
              with:
                node-version: '18'  
            - name: Install Dependencies
              run: npm ci
            - name: Run Tests
              run: npm test